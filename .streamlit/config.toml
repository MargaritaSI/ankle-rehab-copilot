[theme]
base = "light"
font = "Manrope, sans-serif"
headingFont = "Manrope, sans-serif"
baseFontSize = 17
baseFontWeight = 500
headingFontWeights = [800, 800, 700, 700, 700, 700]
headingFontSizes = ["3rem", "2.1rem", "1.5rem", "1.25rem", "1.1rem", "1rem"]
primaryColor = "#2F6F6D"
backgroundColor = "#F7F3EC"
secondaryBackgroundColor = "#EFEAE0"
textColor = "#1B1F1E"
linkColor = "#2F6F6D"
linkUnderline = false
borderColor = "#E6E0D4"
baseRadius = "18px"
buttonRadius = "14px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFDF9"
secondaryBackgroundColor = "#F3EFE6"
borderColor = "#E9E3D7"
